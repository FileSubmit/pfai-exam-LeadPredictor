<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LeadPredictor</title>
  <script>
    (function() {
      try {
        var pref = localStorage.getItem("leadpredictor-theme") || "system";
        var effective = pref === "system"
          ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark")
          : pref;
        document.documentElement.setAttribute("data-theme", effective);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" fill="none" aria-hidden="true">
          <path d="M4 5 H28 L19 16 V26 L13 23 V16 Z" fill="currentColor"/>
        </svg>
        <span class="logo-text"><span class="logo-lead">Lead</span><span class="logo-predictor">Predictor</span></span>
      </div>

      <div class="field">
        <label for="language" data-i18n="language">Language</label>
        <div class="select-wrapper">
          <select id="language">
            <option value="en" data-flag="🇺🇸" data-i18n="english">English</option>
            <option value="es" data-flag="🇪🇸" data-i18n="spanish">Spanish</option>
            <option value="de" data-flag="🇩🇪" data-i18n="german">German</option>
            <option value="fr" data-flag="🇫🇷" data-i18n="french">French</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="currency" data-i18n="currency">Currency</label>
        <div class="select-wrapper">
          <select id="currency">
            <option data-symbol="$" data-i18n="usDollar">US Dollar</option>
            <option data-symbol="€" data-i18n="euro">Euro</option>
            <option data-symbol="£" data-i18n="britishPound">British Pound</option>
            <option data-symbol="¥" data-i18n="japaneseYen">Japanese Yen</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="campaignStart" data-i18n="campaignStart">Campaign Start</label>
        <input type="date" id="campaignStart" value="2026-05-08">
      </div>

      <div class="field">
        <label for="campaignEnd" data-i18n="campaignEnd">Campaign End</label>
        <input type="date" id="campaignEnd" value="2026-11-04">
      </div>

      <div class="field">
        <label for="totalRevenue" data-i18n="totalRevenue">Total Revenue</label>
        <div class="input-with-prefix">
          <span class="prefix" data-prefix="$">$</span>
          <input type="number" id="totalRevenue" value="10000" min="0">
        </div>
      </div>

      <div class="field">
        <label for="avgOrderValue" data-i18n="avgOrderValue">Avg. Order Value</label>
        <div class="input-with-prefix">
          <span class="prefix" data-prefix="$">$</span>
          <input type="number" id="avgOrderValue" value="1000" min="0">
        </div>
      </div>

      <div class="theme-toggle" role="group" aria-label="Theme">
        <button type="button" class="theme-option" data-theme-value="light" aria-label="Light" title="Light">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
          </svg>
        </button>
        <button type="button" class="theme-option" data-theme-value="system" aria-label="System" title="System">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="13" rx="2"/>
            <path d="M8 21h8M12 17v4"/>
          </svg>
        </button>
        <button type="button" class="theme-option" data-theme-value="dark" aria-label="Dark" title="Dark">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="chart-card">
        <div class="chart-container">
          <div class="y-axis-label" data-i18n="months">Months</div>
          <svg id="chart" class="chart"></svg>
          <div id="tooltip" class="tooltip"></div>
        </div>
      </div>

      <div class="controls-card">
        <div class="slider-group">
          <label for="leadRate" data-i18n="leadRate">Lead Response Rate</label>
          <div class="slider-row">
            <div class="range-wrapper">
              <div class="range-track">
                <div class="range-fill" id="leadRateFill"></div>
              </div>
              <input type="range" id="leadRate" min="1" max="100" step="0.01" value="40">
            </div>
            <span class="rate-value" id="leadRateValue">40.00%</span>
          </div>
        </div>
        <div class="slider-group">
          <label for="prospectRate" data-i18n="prospectRate">Prospect Response Rate</label>
          <div class="slider-row">
            <div class="range-wrapper">
              <div class="range-track">
                <div class="range-fill" id="prospectRateFill"></div>
              </div>
              <input type="range" id="prospectRate" min="1" max="100" step="0.01" value="20">
            </div>
            <span class="rate-value" id="prospectRateValue">20.00%</span>
          </div>
        </div>
      </div>
    </main>

    <aside class="stats">
      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-swatch" style="background: var(--bar-prospects)"></span>
          <span class="stat-label" data-i18n="prospects">Prospects</span>
          <span class="stat-percent" id="prospectsPercent">100%</span>
        </div>
        <div class="stat-value" id="prospectsValue">125</div>
        <div class="progress"><div class="progress-bar" id="prospectsBar" style="width:100%; background: var(--bar-prospects)"></div></div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-swatch" style="background: var(--bar-leads)"></span>
          <span class="stat-label" data-i18n="leads">Leads</span>
          <span class="stat-percent" id="leadsPercent">20%</span>
        </div>
        <div class="stat-value" id="leadsValue">25</div>
        <div class="progress"><div class="progress-bar" id="leadsBar" style="width:20%; background: var(--bar-leads)"></div></div>
      </div>

      <div class="stat-card">
        <div class="stat-header">
          <span class="stat-swatch" style="background: var(--bar-customers)"></span>
          <span class="stat-label" data-i18n="customers">Customers</span>
          <span class="stat-percent" id="customersPercent">8%</span>
        </div>
        <div class="stat-value" id="customersValue">10</div>
        <div class="progress"><div class="progress-bar" id="customersBar" style="width:8%; background: var(--bar-customers)"></div></div>
      </div>
    </aside>
  </div>

  <footer class="footer">
    <div class="footer-inner">
      <div class="footer-section">
        <div class="footer-title">Programming Fundamentals with AI — Практически изпит</div>
        <div class="footer-desc">Практически задачи за финален изпит за курса „Основи на програмирането с AI“ в СофтУни.</div>
      </div>
      <div class="footer-meta">
        <div class="footer-row">
          <span class="footer-label">Username</span>
          <span class="footer-value">tsetsotsako</span>
        </div>
        <div class="footer-row">
          <span class="footer-label">Exam doc</span>
          <a class="footer-link" href="https://docs.google.com/document/d/1GG9vXNYaz1hmpmz0Av-0l9Voq_euA6G84pfcAkQiDc0/edit?usp=sharing" target="_blank" rel="noopener noreferrer">View document</a>
        </div>
      </div>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
